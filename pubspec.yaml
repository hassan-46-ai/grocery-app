name: fresh_cart
description: Hammad Stores - grocery shopping app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.9.0
  geolocator: ^14.1.2
  geocoding: ^3.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/products/
    - assets/categories/
    - assets/subcategories/
    - assets/onboarding/
    - assets/brand/
